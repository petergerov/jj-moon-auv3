name: JJMoon
options:
  bundleIdPrefix: com.gerov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.1"
    DEVELOPMENT_TEAM: C9LBGZNZ6P
    CODE_SIGN_STYLE: Automatic

    # Supported Destinations. These four settings are exactly what Xcode's
    # "Supported Destinations" editor writes, so they belong here and nowhere
    # else: `xcodegen generate` rewrites project.pbxproj from this file, and
    # anything set only in the Xcode GUI is gone at the next run.
    #
    # In `base` rather than per target on purpose. They were previously on the
    # app alone, which left the appex either silent on them or disagreeing —
    # and an extension whose supported destinations do not match its host app
    # is a submission problem, not a cosmetic one.
    TARGETED_DEVICE_FAMILY: "1,2"          # 1 = iPhone, 2 = iPad
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  JJMoon:
    type: application
    platform: iOS
    # Matches PRODUCT_NAME below. Without it XcodeGen names the product after
    # the target in the schemes' BuildableName ("JJMoon.app").
    productName: jj-moon
    sources:
      - path: JJMoon
      # Same DSP/AU/UI as the appex so the companion app can host in-process
      # without waiting for iOS to register the extension (fails often on iPad).
      - path: JJMoonExtension/DSP
      - path: JJMoonExtension/Parameters
      - path: JJMoonExtension/UI
      - path: JJMoonExtension/Common/Audio Unit
      - path: JJMoonExtension/Common/DSP
      - path: JJMoonExtension/Common/Parameters
      - path: JJMoonExtension/Common/Utility
      - path: JJMoonExtension/Common/UI
        excludes:
          - AudioUnitViewController.swift
      # Six acoustic demos + Mic in the companion app picker. See
      # SimplePlayEngine.Source for order and spoken names.
      - path: loop/acoustic-guitar-melody-calm.mp3
        type: file
        buildPhase: resources
      - path: loop/chillin-acoustic-guitar.mp3
        type: file
        buildPhase: resources
      - path: loop/acoustic-guitar-chords-loneliness.mp3
        type: file
        buildPhase: resources
      - path: loop/nylon-1.mp3
        type: file
        buildPhase: resources
      - path: loop/nylon-2.mp3
        type: file
        buildPhase: resources
      - path: loop/nylon-3.mp3
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerov.jjmoon
        PRODUCT_NAME: jj-moon
        INFOPLIST_FILE: JJMoon/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: JJMoon/JJMoon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SWIFT_OBJC_BRIDGING_HEADER: JJMoon/Common/JJMoonApp-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS: "$(SRCROOT)/JJMoonExtension/DSP $(SRCROOT)/JJMoonExtension/Parameters $(SRCROOT)/JJMoonExtension/Common/DSP"
        USER_HEADER_SEARCH_PATHS: "$(SRCROOT)/JJMoonExtension/DSP $(SRCROOT)/JJMoonExtension/Parameters $(SRCROOT)/JJMoonExtension/Common/DSP"
        OTHER_LDFLAGS: "-framework AudioToolbox -framework AVFoundation -framework CoreAudioKit"
    dependencies:
      - target: JJMoonExtension
        embed: true
        codeSign: true
    scheme:
      gatherCoverageData: false

  JJMoonExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JJMoonExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerov.jjmoon.AUv3
        PRODUCT_NAME: JJMoonExtension
        PRODUCT_MODULE_NAME: JJMoonExtension
        INFOPLIST_FILE: JJMoonExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: JJMoonExtension/JJMoonExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: JJMoonExtension/Common/JJMoon-Bridging-Header.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_MODULES: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/JJMoonExtension/DSP $(SRCROOT)/JJMoonExtension/Parameters $(SRCROOT)/JJMoonExtension/Common/DSP"
        USER_HEADER_SEARCH_PATHS: "$(SRCROOT)/JJMoonExtension/DSP $(SRCROOT)/JJMoonExtension/Parameters $(SRCROOT)/JJMoonExtension/Common/DSP"
        OTHER_LDFLAGS: "-framework AudioToolbox -framework AVFoundation -framework CoreAudioKit"

  # Asset generator, not a test suite. It drives the container app and
  # attaches the marketing screenshots; `screenshots/make-screenshots.sh`
  # runs it and unpacks the result bundle. Deliberately kept out of the
  # `jj-moon` scheme so a normal build or archive never waits on it.
  JJMoonScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: screenshots/ScreenshotTests.swift
    dependencies:
      - target: JJMoon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerov.jjmoon.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JJMoon

schemes:
  jj-moon:
    build:
      targets:
        JJMoon: all
        # Do not archive the appex as its own product — that becomes a
        # generic archive and App Store Connect has no record for it.
        JJMoonExtension:
          - run
          - test
          - profile
          - analyze
    run:
      config: Debug
      askForAppToLaunch: false
      storeKitConfiguration: Configuration/Products.storekit
    archive:
      config: Release

  screenshots:
    build:
      targets:
        JJMoon: [run, test]
        JJMoonScreenshots: [test]
    test:
      config: Debug
      targets:
        - JJMoonScreenshots
      # Without this the paywall shot is a spinner: StoreKit has no products
      # to price outside a configured environment.
      storeKitConfiguration: Configuration/Products.storekit
    run:
      config: Debug
      storeKitConfiguration: Configuration/Products.storekit
